[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "midea-ble-home-assistant"
version = "0.3.0"
description = "Home Assistant custom integration for Midea BLE air conditioners"
requires-python = ">=3.14.2"
dependencies = ["cryptography>=44.0.0"]

[project.optional-dependencies]
test = [
  "homeassistant==2026.8.1",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["custom_components.midea_ble*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/midea_ble/protocol", "tests"]
explicit_package_bases = true
ignore_missing_imports = true
