name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.14"}
      - run: python -m pip install -e '.[test]'
      - run: ruff check .
      - run: mypy
      - run: pytest
